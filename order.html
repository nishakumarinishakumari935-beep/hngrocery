<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Order Enquiry | HN ENTERPRISES</title>

  <link rel="stylesheet" href="order.css">
</head>

<body>

  <main class="order-box">

    <a class="back-link" href="index.html">
      ← Back to Home
    </a>

    <h1>Product Enquiry</h1>

    <p class="intro">
      Share your details and HN ENTERPRISES can contact you about this product.
    </p>

    <div class="product-info">

      <img id="productImg" alt="Selected product">

      <h2 id="productName">
        Product enquiry
      </h2>

    </div>

    <form id="orderForm">

      <label for="fullName">
        Full Name
      </label>

      <input
        id="fullName"
        name="fullName"
        type="text"
        autocomplete="name"
        required
      >

      <label for="mobile">
        Mobile Number
      </label>

      <input
        id="mobile"
        name="mobile"
        type="tel"
        inputmode="numeric"
        pattern="[0-9+\-\s]{10,15}"
        autocomplete="tel"
        required
      >

      <label for="qty">
        Quantity
      </label>

      <input
        id="qty"
        name="quantity"
        type="number"
        value="1"
        min="1"
        required
      >

      <label for="address">
        Delivery Address
      </label>

      <textarea
        id="address"
        name="address"
        rows="4"
        autocomplete="street-address"
        required
      ></textarea>

      <button type="submit">
        Submit Enquiry
      </button>

    </form>

    <p id="formMessage" class="form-message" role="status">
      Note: Online order submission is not connected yet.
      This form is currently a front-end enquiry demo.
    </p>

  </main>

  <script>

    const params = new URLSearchParams(window.location.search);

    const productName =
      params.get("name") || "Product enquiry";

    const productImage =
      params.get("image") || "";

    document.getElementById("productName").textContent =
      productName;

    if (productImage) {

      document.getElementById("productImg").src =
        productImage;

    } else {

      document.getElementById("productImg").hidden = true;

    }

    document.getElementById("orderForm").addEventListener(
      "submit",
      (event) => {

        event.preventDefault();

        document.getElementById("formMessage").textContent =
          "Your details have been entered, but this website is not yet connected to an order server. No order has been sent or saved. Please call 8294891066 or 7739233551 to confirm your enquiry.";

        document.getElementById("formMessage").classList.add("warning");

      }
    );

  </script>

</body>
</html>
